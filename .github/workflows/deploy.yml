name: Deploy Portfolio to GitHub Pages

on:
  # Se ejecuta automáticamente con cada commit en la rama main
  push:
    branches: ["main"]

  # Te permite ejecutar el deploy manualmente desde la pestaña Actions si lo necesitas
  workflow_dispatch:

# Establece los permisos necesarios para interactuar con GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita ejecuciones simultáneas; si haces dos commits seguidos, cancela el anterior y prioriza el último
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefactos de la web estática
        uses: actions/upload-pages-artifact@v3
        with:
          # Sube todo el contenido de la raíz (donde está tu index.html)
          path: '.'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
